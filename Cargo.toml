[package]
name = "falcon-z3"
version = "0.6.0"
edition = "2021"
authors = ["Alex Eubanks <endeavor@rainbowsandpwnies.com>"]
homepage = "https://github.com/falconre/falcon-z3"
repository = "https://github.com/falconre/falcon-z3"
description = "Rust bindings for z3 and Falcon"
readme = "README.md"
license = "MIT"

[dependencies]
falcon = "0.6"
num-bigint = { version="0.4.6", features = ["serde"]}
num-traits = "0.2"
thiserror = "2"
z3-sys = "0.10"

[features]
thread_safe = ["falcon/thread_safe"]

[lib]
name = "falcon_z3"
path = "lib/lib.rs"
